name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - run: clojure -M:test

      - run: clojure -M:lint

      # The :cljs branch is not covered by the JVM suite, and the reader
      # conditionals here are the byte conversions §4.2.3 hashes over.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm install -g nbb
      - run: npm run smoke
